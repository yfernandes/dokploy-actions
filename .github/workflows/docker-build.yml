name: Build Docker Images off File Changes

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  packages: write

jobs:
  changes:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      admin: ${{ steps.changes.outputs.admin }}
      dispensario: ${{ steps.changes.outputs.dispensario }}
      storefront: ${{ steps.changes.outputs.storefront }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        uses: dorny/paths-filter@v2
        with:
          base: ${{ github.event.pull_request.base.ref || github.ref_name }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          filters: |
            admin:
              - 'apps/admin/**'
              - 'packages/c6-bank/**'
              - 'packages/payment-c6/**'
              - 'packages/tiny/**'
              - 'packages/memphis/**'
              - 'packages/mile/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            # dispensario:
            #   - 'apps/dispensario/**'
            #   - 'packages/c6-bank/**'
            #   - 'packages/ds/**'
            #   - 'package.json'
            #   - 'pnpm-lock.yaml'
            #   - 'pnpm-workspace.yaml'
            storefront:
              - 'apps/storefront/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  build-admin:
    name: Build Admin Docker Image
    needs: changes
    if: ${{ needs.changes.outputs.admin == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref_name == 'main' || github.ref_name == 'develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Admin Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/admin/Dockerfile
          push: ${{ github.ref_name == 'main' || github.ref_name == 'develop' }}
          tags: |
            ${{ github.ref_name == 'main' || github.ref_name == 'develop' && 'ghcr.io/greenbudz/medusa-admin:latest' || '' }}
            ${{ github.ref_name == 'main' || github.ref_name == 'develop' && format('ghcr.io/greenbudz/medusa-admin:sha-{0}', github.sha) || '' }}
            ${{ github.event_name == 'pull_request' && format('ghcr.io/greenbudz/medusa-admin:pr-{0}', github.event.pull_request.number) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: ${{ github.ref_name == 'main' || github.ref_name == 'develop' && 'type=image' || 'type=docker,dest=/tmp/admin-image.tar' }}

      - name: Log build completion
        run: |
          echo "✅ Admin Docker image built successfully"
          echo "Image: ${{ steps.build.outputs.image }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

  build-storefront:
    name: Build Storefront Docker Image
    needs: changes
    if: ${{ needs.changes.outputs.storefront == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref_name == 'main' || github.ref_name == 'develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Storefront Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/storefront/Dockerfile
          push: ${{ github.ref_name == 'main' || github.ref_name == 'develop' }}
          tags: |
            ${{ github.ref_name == 'main' || github.ref_name == 'develop' && 'ghcr.io/greenbudz/medusa-storefront:latest' || '' }}
            ${{ github.ref_name == 'main' || github.ref_name == 'develop' && format('ghcr.io/greenbudz/medusa-storefront:sha-{0}', github.sha) || '' }}
            ${{ github.event_name == 'pull_request' && format('ghcr.io/greenbudz/medusa-storefront:pr-{0}', github.event.pull_request.number) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: ${{ github.ref_name == 'main' || github.ref_name == 'develop' && 'type=image' || 'type=docker,dest=/tmp/storefront-image.tar' }}

      - name: Log build completion
        run: |
          echo "✅ Storefront Docker image built successfully"
          echo "Image: ${{ steps.build.outputs.image }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

