name: 'Update Dokploy Provider'
description: 'Update application provider configuration in Dokploy (Docker, Git, Compose, etc.)'
author: 'Dokploy Actions'

branding:
  icon: 'refresh-cw'
  color: 'blue'

inputs:
  dokploy_url:
    description: 'Dokploy instance URL (e.g., https://dokploy.example.com)'
    required: true
  api_key:
    description: 'Dokploy API key'
    required: true
  app_id:
    description: 'Dokploy application ID'
    required: true
  docker_image:
    description: 'Docker image to deploy (e.g., myimage:latest or registry.com/myimage:latest)'
    required: true
  registry_url:
    description: 'Docker registry URL (optional, for private registries)'
    required: false
    default: ''
  username:
    description: 'Docker registry username (optional, for private registries)'
    required: false
    default: ''
  password:
    description: 'Docker registry password (optional, for private registries)'
    required: false
    default: ''

outputs:
  success:
    description: 'Whether the update was successful (true/false)'
    value: ${{ steps.update.outputs.success }}
  error_message:
    description: 'Error message if update failed'
    value: ${{ steps.update.outputs.error }}

runs:
  using: 'composite'
  steps:
    - id: update
      shell: bash
      run: |
        set +e
        
        DOCKER_IMAGE="${{ inputs.docker_image }}"
        REGISTRY_URL="${{ inputs.registry_url }}"
        USERNAME="${{ inputs.username }}"
        PASSWORD="${{ inputs.password }}"
        
        echo "Updating Docker provider for application ${{ inputs.app_id }}..."
        
        # Build request payload
        PAYLOAD='{
          "applicationId": "${{ inputs.app_id }}",
          "dockerImage": "'$DOCKER_IMAGE'"'
        
        # Add optional fields if provided
        if [ -n "$REGISTRY_URL" ]; then
          PAYLOAD="${PAYLOAD},\"registryUrl\": \"$REGISTRY_URL\""
        fi
        if [ -n "$USERNAME" ]; then
          PAYLOAD="${PAYLOAD},\"username\": \"$USERNAME\""
        fi
        if [ -n "$PASSWORD" ]; then
          PAYLOAD="${PAYLOAD},\"password\": \"$PASSWORD\""
        fi
        
        PAYLOAD="${PAYLOAD}}"
        
        echo "Sending request to Dokploy API..."
        
        RESPONSE=$(curl -X POST "${{ inputs.dokploy_url }}/api/application.saveDockerProvider" \
          -H "x-api-key: ${{ inputs.api_key }}" \
          -H "Content-Type: application/json" \
          -d "$PAYLOAD" \
          -w "\n%{http_code}" \
          2>/dev/null)
        
        HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
        BODY=$(echo "$RESPONSE" | sed '$d')
        
        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ Docker provider update failed with status $HTTP_CODE"
          echo "Response: $BODY"
          echo "success=false" >> $GITHUB_OUTPUT
          echo "error=HTTP $HTTP_CODE: $BODY" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        echo "✅ Docker provider updated successfully"
        echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"
        echo "success=true" >> $GITHUB_OUTPUT
